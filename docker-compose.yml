      - KAFKA_SERVER=kafka:9092
      - KAFKA_TOPIC=sensor_data_drone4
      - FLOWER_SERVER=server:5000
      - CLIENT_ID=4
      - KAFKA_GROUP=drone4_group

  #---------------------------------------------- DRONE 5 ----------------------------------------------

  producer5:
    build:
      context: ./Producer
      dockerfile: Dockerfile.producer
    depends_on:
      - kafka
    environment:
      - KAFKA_SERVER=kafka:9092
